<mat-toolbar color="primary" class="app-toolbar">

  <!-- Left side: Branding (Logo and Title) -->
  <div class="toolbar-brand">
    <img [src]="logoUrl" alt="Open Library Logo" class="toolbar-logo">
    <span>Open Library Explorer</span>
  </div>

  <!-- Invisible spacer that pushes the switcher to the far right -->
  <span class="toolbar-spacer"></span>

  <!-- Right side: The imported Language Switcher -->
  <app-language-switcher></app-language-switcher>

</mat-toolbar>
